<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>rbrbnd</title>
<style>
  :root{
    --ink:#000000;
    --white:#ffffff;
    --ice:#aec6d4;
    --ice-dim:#56656e;
    --ice-faint:#2a343a;
    --font:'Segoe UI Variable Display','Segoe UI Variable','Segoe UI',system-ui,-apple-system,sans-serif;
    --ease:cubic-bezier(0.16,1,0.3,1);
    --pad:clamp(20px,5vw,42px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    width:100%;height:100vh;height:100dvh;margin:0;
    background:var(--ink);color:var(--white);
    font-family:var(--font);overflow:hidden;position:relative;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    user-select:none;
  }
  #art{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
  .vignette{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(125% 120% at 50% 38%, transparent 50%, rgba(0,0,0,0.55) 100%)}
  .stage{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
  .scrim{position:absolute;left:0;right:0;bottom:0;height:62%;z-index:0;pointer-events:none;
    background:linear-gradient(to top, rgba(0,0,0,0.74), rgba(0,0,0,0.18) 55%, transparent);
    opacity:0;transition:opacity 1s ease}
  body.active .scrim{opacity:1}
  .top-air{flex:0 0 auto;height:clamp(40px,9vh,92px)}
  .menu{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;padding:0 var(--pad);
    transition:opacity .55s ease;touch-action:none}
  body.active .menu{opacity:.34;pointer-events:none}
  .menu-track{will-change:transform;touch-action:none}
  .list{list-style:none}
  .row{display:flex;align-items:baseline;justify-content:space-between;
    font-weight:300;font-size:clamp(32px,9vw,84px);line-height:1.12;letter-spacing:-0.01em;
    color:var(--ice);text-transform:lowercase;white-space:nowrap;cursor:default;
    opacity:0;transform:translateY(12px);animation:rowIn .62s var(--ease) both;transition:color .26s ease}
  @keyframes rowIn{to{opacity:1;transform:none}}
  .row .label{overflow:hidden;text-overflow:clip}
  .row.lit,.row:hover{color:var(--white)}
  .row-add,.row-start{justify-content:flex-start}
  .row-btn{background:none;border:none;padding:0;margin:0;font:inherit;color:inherit;text-align:left;
    text-transform:lowercase;letter-spacing:inherit;cursor:pointer;width:100%}
  .row-btn:active{opacity:.6}
  .row-btn:focus-visible{outline:1px solid var(--ice);outline-offset:3px}
  .row-add .plus{color:var(--ice-dim);margin-right:.42em;transition:color .26s ease}
  .row-add.lit .plus,.row-add:hover .plus{color:var(--white)}
  .row-add input{width:100%;background:none;border:none;font:inherit;color:var(--white);
    text-transform:lowercase;letter-spacing:inherit;caret-color:var(--ice)}
  .row-add input::placeholder{color:var(--ice-dim)}
  .row-add input:focus-visible{outline:none}
  .remove{flex:0 0 auto;align-self:center;background:none;border:none;cursor:pointer;
    font:inherit;font-weight:300;font-size:.62em;line-height:1;color:var(--ice-dim);
    padding:.18em .1em .18em .4em;opacity:0;transform:translateX(4px);
    transition:opacity .22s ease,transform .22s var(--ease),color .22s ease}
  .row.lit .remove,.row:hover .remove{opacity:1;transform:none}
  .remove:hover{color:var(--white)}
  .remove:focus-visible{outline:1px solid var(--ice);opacity:1}
  .dock{flex:0 0 auto;max-height:0;opacity:0;overflow:hidden;padding:0 var(--pad);position:relative;z-index:1;
    transition:max-height .6s var(--ease),opacity .45s ease,padding .6s var(--ease)}
  body.active .dock{max-height:74vh;opacity:1;padding:clamp(14px,3vh,26px) var(--pad) 0}
  .dock.flash{animation:dockFlash .6s var(--ease)}
  @keyframes dockFlash{0%{opacity:1}30%{opacity:.25}100%{opacity:1}}
  .pan{position:relative;overflow:hidden;margin:0 calc(var(--pad)*-1);padding:0 var(--pad);touch-action:none}
  .pan-track{display:inline-flex;gap:clamp(18px,4vw,40px);align-items:baseline;white-space:nowrap;will-change:transform;cursor:grab;touch-action:none}
  .pan-track.dragging{cursor:grabbing}
  .pan-word{font-weight:300;font-size:clamp(26px,6.5vw,56px);line-height:1.1;color:var(--ice);
    text-transform:lowercase;letter-spacing:-0.01em;transition:color .26s ease}
  .pan-word:hover{color:var(--white)}
  .np-meta{margin-top:clamp(12px,2.4vh,20px)}
  .np-title{font-weight:300;font-size:clamp(20px,4.6vw,30px);line-height:1.08;color:var(--white);text-transform:lowercase}
  .np-sub{font-weight:400;font-size:clamp(10px,1.5vw,13px);color:var(--ice);text-transform:lowercase;margin-top:6px;letter-spacing:.04em}
  .scrub{position:relative;height:2px;background:var(--ice-faint);margin:clamp(12px,2.2vh,18px) 0 9px}
  .scrub-fill{position:absolute;inset:0 auto 0 0;width:0%;background:var(--white);transition:width 1s linear}
  .scrub-fill::after{content:'';position:absolute;right:-1px;top:50%;width:2px;height:9px;background:var(--white);transform:translateY(-50%)}
  .np-times{display:flex;justify-content:space-between;font-weight:400;font-size:clamp(10px,1.5vw,13px);
    color:var(--ice);font-variant-numeric:tabular-nums;letter-spacing:.05em}
  .transport{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:clamp(10px,2vh,16px)}
  .transport button{background:none;border:none;cursor:pointer;padding:8px 16px;display:flex;align-items:center;gap:5px;height:30px}
  .transport button:focus-visible{outline:1px solid var(--ice);outline-offset:4px}
  .bar{width:3px;height:18px;background:var(--ice);transition:background .25s ease}
  .transport button:hover .bar{background:var(--white)}
  .keys{font-weight:400;font-size:clamp(9px,1.3vw,11px);color:var(--ice-dim);text-transform:lowercase;letter-spacing:.12em}
  @media (prefers-reduced-motion:reduce){
    .row{animation:none;opacity:1;transform:none}
    .dock,.scrim,.scrub-fill{transition:none}
  }
</style>
</head>
<body>
  <canvas id="art"></canvas>
  <div class="vignette"></div>
  <div class="stage">
    <div class="scrim"></div>
    <div class="top-air"></div>
    <div class="menu" id="menu">
      <div class="menu-track" id="menuTrack">
        <ul class="list" id="list"></ul>
      </div>
    </div>
    <div class="dock" id="dock">
      <div class="pan" id="pan">
        <div class="pan-track" id="panTrack"></div>
      </div>
      <div class="np-meta">
        <div class="np-title">focus session</div>
        <div class="np-sub" id="npSub">holding 0 sites</div>
      </div>
      <div class="scrub"><div class="scrub-fill" id="scrubFill"></div></div>
      <div class="np-times"><span id="tElapsed">00:00</span><span id="tRemain">25:00</span></div>
      <div class="transport">
        <button id="transportBtn" aria-label="stop session"><span class="bar"></span><span class="bar"></span></button>
        <span class="keys">space · esc</span>
      </div>
    </div>
  </div>
<script>
function callApi(method, ...args){
  if (window.pywebview && window.pywebview.api && window.pywebview.api[method]) {
    return window.pywebview.api[method](...args);
  }
  console.log(`[mock] pywebview.api.${method}(${args.map(a=>JSON.stringify(a)).join(', ')})`);
}
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const state = {
  active:false, editing:false, cursor:0,
  totalSeconds:25*60, remaining:25*60, startTime:null, tickHandle:null,
  items:['twitter.com','reddit.com','youtube.com'],
};
const $ = id => document.getElementById(id);
const el = {
  body:document.body, menu:$('menu'), menuTrack:$('menuTrack'), list:$('list'),
  dock:$('dock'), pan:$('pan'), panTrack:$('panTrack'), npSub:$('npSub'),
  scrubFill:$('scrubFill'), tElapsed:$('tElapsed'), tRemain:$('tRemain'),
  transportBtn:$('transportBtn'),
};
function hashStr(s){
  let h=2166136261>>>0;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return (h>>>0)/4294967296;
}
const HUES=[
  [0.89,0.00,0.55],[1.00,0.54,0.00],[0.00,0.69,0.63],
  [0.36,0.29,1.00],[0.29,0.62,0.82],[1.00,0.24,0.50],[0.55,0.20,0.80]
];
function hueAt(f){
  f=(((f%1)+1)%1)*HUES.length; const i=Math.floor(f), fr=f-i;
  const a=HUES[i%HUES.length], b=HUES[(i+1)%HUES.length];
  return [a[0]+(b[0]-a[0])*fr, a[1]+(b[1]-a[1])*fr, a[2]+(b[2]-a[2])*fr];
}
const art = { seedCur:0, seedTarget:0, focusCur:.5, focusTarget:.5,
              activeCur:0, activeTarget:0, time:0,
              c0:[0,0,0], c1:[0,0,0], c2:[0,0,0] };
const canvas = $('art');
let draw = null;
const VERT = `attribute vec2 a_pos; void main(){ gl_Position=vec4(a_pos,0.0,1.0); }`;
const FRAG = `
precision highp float;
uniform vec2 u_res; uniform float u_time,u_seed,u_active,u_focus,u_scroll;
uniform vec3 u_c0,u_c1,u_c2;
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }
float vnoise(vec2 p){
  vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
}
float fbm(vec2 p){ float v=0.0,a=0.5;
  for(int i=0;i<4;i++){ v+=a*vnoise(p); p=p*2.0+vec2(1.7,9.2); a*=0.5; } return v; }
void main(){
  vec2 uv=gl_FragCoord.xy/u_res; float ar=u_res.x/max(u_res.y,1.0);
  vec2 p=(uv-0.5)*vec2(ar,1.0)*3.0; p.y+=u_scroll*0.6;
  float t=u_time*0.05+u_seed*6.2831;
  vec2 q=vec2(fbm(p+vec2(u_seed*5.0,t)), fbm(p+vec2(5.2+u_seed*3.0,1.3+t)));
  float f=fbm(p+q*2.2+vec2(t*0.5)); float tt=clamp(f,0.0,1.0);
  vec3 col=mix(u_c0,u_c1,smoothstep(0.0,0.5,tt));
  col=mix(col,u_c2,smoothstep(0.45,1.0,tt));
  vec2 foc=vec2(0.5+0.22*sin(u_focus*3.14159),0.42+0.12*cos(u_focus*2.0));
  float d=distance(uv,foc);
  vec3 warm=mix(vec3(0.55,0.7,0.95),vec3(1.0,0.78,0.55),u_active);
  col+=(1.0-smoothstep(0.0,0.75,d))*0.12*warm;
  float lum=dot(col,vec3(0.2126,0.7152,0.0722));
  col=mix(vec3(lum)*vec3(0.78,0.9,1.0),col,mix(0.28,1.0,u_active));
  col*=mix(0.30,1.0,u_active*0.85+0.15);
  float vig=smoothstep(1.25,0.30,length((uv-0.5)*vec2(1.05,1.15)));
  col*=mix(0.5,1.0,vig);
  col+=(hash(gl_FragCoord.xy+fract(u_time)*17.3)-0.5)*0.035;
  gl_FragColor=vec4(col,1.0);
}`;
function initGL(){
  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if(!gl) return null;
  const mk=(t,s)=>{ const sh=gl.createShader(t); gl.shaderSource(sh,s); gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){ console.warn(gl.getShaderInfoLog(sh)); return null; } return sh; };
  const vs=mk(gl.VERTEX_SHADER,VERT), fs=mk(gl.FRAGMENT_SHADER,FRAG);
  if(!vs||!fs) return null;
  const prog=gl.createProgram(); gl.attachShader(prog,vs); gl.attachShader(prog,fs); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){ console.warn(gl.getProgramInfoLog(prog)); return null; }
  gl.useProgram(prog);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 1,-1, -1,1, 1,1]),gl.STATIC_DRAW);
  const aPos=gl.getAttribLocation(prog,'a_pos'); gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
  const L=n=>gl.getUniformLocation(prog,n);
  const loc={res:L('u_res'),time:L('u_time'),seed:L('u_seed'),active:L('u_active'),
             focus:L('u_focus'),scroll:L('u_scroll'),c0:L('u_c0'),c1:L('u_c1'),c2:L('u_c2')};
  return gl=>{
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.uniform2f(loc.res,canvas.width,canvas.height);
    gl.uniform1f(loc.time,art.time); gl.uniform1f(loc.seed,art.seedCur);
    gl.uniform1f(loc.active,art.activeCur); gl.uniform1f(loc.focus,art.focusCur);
    gl.uniform1f(loc.scroll,vScroller.progress());
    gl.uniform3fv(loc.c0,art.c0); gl.uniform3fv(loc.c1,art.c1); gl.uniform3fv(loc.c2,art.c2);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  };
}
function initFallback(){
  const ctx=canvas.getContext('2d'); if(!ctx) return ()=>{};
  let last=0;
  return now=>{
    if(now-last<42) return; last=now;           
    const w=canvas.width,h=canvas.height;
    const fx=(0.5+0.22*Math.sin(art.focusCur*Math.PI))*w;
    const fy=(0.42+0.12*Math.cos(art.focusCur*2))*h;
    const r=Math.max(w,h)*0.9;
    const b=0.30+0.70*(art.activeCur*0.85+0.15);
    const g=ctx.createRadialGradient(fx,fy,0,fx,fy,r);
    const c=(v,a)=>`rgba(${v.map(x=>Math.round(x*255*b)).join(',')},${a})`;
    g.addColorStop(0,c(art.c0,1)); g.addColorStop(0.55,c(art.c1,1)); g.addColorStop(1,c(art.c2,1));
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  };
}
function sizeCanvas(){
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  canvas.width=Math.max(1,Math.round(canvas.clientWidth*dpr));
  canvas.height=Math.max(1,Math.round(canvas.clientHeight*dpr));
}
function Scroller(viewport, track, axis){
  let offset=0, vel=0, dragging=false, dragged=false, scrollable=false;
  let px=0, py=0, raf=0;
  const friction=0.90;
  const size=()=> axis==='x' ? track.getBoundingClientRect().width - viewport.clientWidth
                             : track.getBoundingClientRect().height - viewport.clientHeight;
  const clamp=()=>{ const mx=Math.max(0,size()); if(offset>0){offset=0;vel=0;} if(offset<-mx){offset=-mx;vel=0;} };
  const apply=()=>{ track.style.transform = axis==='x' ? `translate3d(${offset}px,0,0)` : `translate3d(0,${offset}px,0)`; };
  const tick=()=>{ if(!dragging){ offset+=vel; vel*=friction; if(Math.abs(vel)<0.1) vel=0; clamp(); }
    apply(); viewport.classList.toggle('scrollable', size()>1);
    if(dragging||Math.abs(vel)>0.1) raf=requestAnimationFrame(tick); else raf=0; };
  const kick=()=>{ if(!raf) raf=requestAnimationFrame(tick); };
  this.measure=()=>{ clamp(); apply(); viewport.classList.toggle('scrollable', size()>1); };
  this.progress=()=>{ const mx=Math.max(1,size()); return Math.min(1,Math.max(0,-offset/mx))-0.5; };
  this.nudge=v=>{ vel+=v; kick(); };
  viewport.addEventListener('pointerdown',e=>{
    if(e.target.closest('input,.remove,.row-btn')) return;
    scrollable = size()>1; if(!scrollable) return;
    dragging=true; dragged=false; px=e.clientX; py=e.clientY;
    if(axis==='x') track.classList.add('dragging');
  });
  window.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const d = axis==='x' ? e.clientX-px : e.clientY-py; px=e.clientX; py=e.clientY;
    if(Math.abs(d)>0.5) dragged=true;
    offset+=d; vel=d; clamp(); apply(); kick();
  });
  window.addEventListener('pointerup',()=>{
    if(!dragging) return; dragging=false;
    if(axis==='x') track.classList.remove('dragging'); kick();
  });
  viewport.addEventListener('click',e=>{ if(dragged){ e.stopPropagation(); e.preventDefault(); dragged=false; } },true);
  viewport.addEventListener('wheel',e=>{
    const s=size(); if(s<=1) return;
    e.preventDefault();
    const d = axis==='x' ? (Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY) : e.deltaY;
    vel += -d*0.8; kick();
  },{passive:false});
}
let rowMeta=[];
const fmt=s=>{ s=Math.max(0,Math.round(s)); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; };
function buildAddContent(li, editing){
  li.className='row row-add'; li.innerHTML='';
  if(editing){
    const input=document.createElement('input'); input.type='text';
    input.placeholder='add a site or app'; input.setAttribute('aria-label','add a site or app');
    li.appendChild(input);
  } else {
    const btn=document.createElement('button'); btn.className='row-btn';
    btn.innerHTML='<span class="plus">+</span>add'; li.appendChild(btn);
  }
}
function renderList(){
  el.list.innerHTML=''; rowMeta=[]; let idx=0;
  state.items.forEach((item,i)=>{
    const li=document.createElement('li'); li.className='row';
    if(state.active){ li.style.animation='none'; li.style.opacity='1'; }
    else li.style.animationDelay=`${idx*65}ms`;
    const label=document.createElement('span'); label.className='label'; label.textContent=item;
    const rm=document.createElement('button'); rm.className='remove';
    rm.setAttribute('aria-label',`remove ${item}`); rm.dataset.i=i; rm.textContent='×';
    li.appendChild(label); li.appendChild(rm); el.list.appendChild(li);
    rowMeta.push({type:'data',i}); idx++;
  });
  if(!state.active){
    const addLi=document.createElement('li'); addLi.style.animationDelay=`${idx*65}ms`;
    buildAddContent(addLi,state.editing); el.list.appendChild(addLi); rowMeta.push({type:'add'}); idx++;
    const startLi=document.createElement('li'); startLi.className='row row-start';
    startLi.style.animationDelay=`${idx*65}ms`;
    const sb=document.createElement('button'); sb.className='row-btn'; sb.textContent='start session';
    startLi.appendChild(sb); el.list.appendChild(startLi); rowMeta.push({type:'start'});
  }
  applyCursor();
  if(state.editing){ const inp=el.list.querySelector('.row-add input'); if(inp) requestAnimationFrame(()=>inp.focus()); }
  vScroller.measure();
}
function renderPanorama(){
  el.panTrack.innerHTML='';
  state.items.forEach(item=>{
    const s=document.createElement('span'); s.className='pan-word'; s.textContent=item;
    el.panTrack.appendChild(s);
  });
  requestAnimationFrame(()=>hScroller.measure());
}
function applyCursor(){
  [...el.list.children].forEach((li,k)=>li.classList.toggle('lit', k===state.cursor && !state.active));
  const m=rowMeta[state.cursor];
  if(state.active){ art.focusTarget=0.5; }
  else if(m && m.type==='data'){ const n=state.items.length; art.focusTarget = n>1 ? m.i/(n-1) : 0.5; }
  else art.focusTarget=1.0;
}
function setCursor(k){
  if(state.active) return;
  state.cursor=Math.max(0,Math.min(k,el.list.children.length-1)); applyCursor();
}
function renderDock(){
  el.npSub.textContent=`holding ${state.items.length} ${state.items.length===1?'site':'sites'}  ·  drag the row to look`;
}
function renderProgress(){
  const elapsed=state.active?state.totalSeconds-state.remaining:0;
  el.scrubFill.style.width=`${state.active?(elapsed/state.totalSeconds)*100:0}%`;
  el.tElapsed.textContent=fmt(elapsed); el.tRemain.textContent=fmt(state.remaining);
}
function renderState(){ el.body.classList.toggle('active',state.active); }
function renderAll(){ renderList(); renderPanorama(); renderDock(); renderProgress(); renderState(); }
function startEdit(){
  if(state.active||state.editing) return; state.editing=true;
  const addLi=el.list.querySelector('.row-add');
  if(addLi){ buildAddContent(addLi,true); requestAnimationFrame(()=>{ const i=addLi.querySelector('input'); if(i) i.focus(); }); }
}
function cancelEdit(){ state.editing=false; const a=el.list.querySelector('.row-add'); if(a) buildAddContent(a,false); }
function commitEdit(val){
  val=(val||'').trim(); state.editing=false;
  if(val){
    state.items.push(val); art.seedTarget=hashStr(state.items.join('|'));
    renderList(); renderPanorama(); renderDock();
    state.cursor=rowMeta.findIndex(m=>m.type==='add'); if(state.cursor<0) state.cursor=0;
    applyCursor(); callApi('save_blocklist',state.items);
  } else cancelEdit();
}
function tick(){
  if(!state.active) return;
  const elapsed=Math.floor((Date.now()-state.startTime)/1000);
  state.remaining=Math.max(0,state.totalSeconds-elapsed); renderProgress();
  if(state.remaining<=0) stopSession();
}
function startSession(){
  if(state.active||!state.items.length) return;
  if(state.editing) cancelEdit();
  state.active=true; state.remaining=state.totalSeconds; state.startTime=Date.now();
  state.cursor=-1; art.activeTarget=1; state.tickHandle=setInterval(tick,1000);
  renderAll(); callApi('start_block',state.items,state.totalSeconds);
}
function stopSession(){
  if(!state.active) return;
  state.active=false; clearInterval(state.tickHandle); state.cursor=0; art.activeTarget=0;
  renderAll(); el.dock.classList.remove('flash'); void el.dock.offsetWidth; el.dock.classList.add('flash');
  callApi('stop_block');
}
function toggle(){ state.active?stopSession():startSession(); }
function removeAt(i){
  state.items.splice(i,1); art.seedTarget=hashStr(state.items.join('|'));
  renderList(); renderPanorama(); renderDock();
  setCursor(Math.min(state.cursor,el.list.children.length-1)); callApi('save_blocklist',state.items);
}
function actOnCursor(){ const m=rowMeta[state.cursor]; if(!m) return;
  if(m.type==='add') startEdit(); else if(m.type==='start') startSession(); }
el.list.addEventListener('mouseover',e=>{ const li=e.target.closest('.row'); if(li) setCursor([...el.list.children].indexOf(li)); });
el.list.addEventListener('click',e=>{
  const rm=e.target.closest('.remove');
  if(rm){ e.stopPropagation(); removeAt(Number(rm.dataset.i)); return; }
  const li=e.target.closest('.row'); if(!li) return;
  setCursor([...el.list.children].indexOf(li));
  const m=rowMeta[state.cursor];
  if(m&&m.type==='start') startSession();
  else if(m&&m.type==='add'&&!state.editing) startEdit();
});
el.list.addEventListener('keydown',e=>{
  if(e.target.matches('.row-add input')){
    if(e.key==='Enter'){ e.preventDefault(); commitEdit(e.target.value); }
    else if(e.key==='Escape'){ e.preventDefault(); cancelEdit(); }
  }
});
el.list.addEventListener('focusout',e=>{
  if(state.editing&&e.target.matches('.row-add input')) setTimeout(()=>{ if(state.editing) commitEdit(e.target.value); },0);
});
el.transportBtn.addEventListener('click',stopSession);
document.addEventListener('keydown',e=>{
  const typing=document.activeElement&&document.activeElement.matches('.row-add input');
  if(typing) return;
  if(state.active){
    if(e.key==='ArrowLeft'){ e.preventDefault(); hScroller.nudge(120); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); hScroller.nudge(-120); }
    else if(e.key===' '||e.code==='Space'){ e.preventDefault(); toggle(); }
    else if(e.key==='Escape'){ stopSession(); }
    return;
  }
  if(e.key==='ArrowDown'){ e.preventDefault(); setCursor(state.cursor+1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); setCursor(state.cursor-1); }
  else if(e.key==='Enter'){ if(document.activeElement&&document.activeElement.matches('button')) return; e.preventDefault(); actOnCursor(); }
  else if(e.key===' '||e.code==='Space'){ e.preventDefault(); if(document.activeElement) document.activeElement.blur(); toggle(); }
});
const vScroller=new Scroller(el.menu, el.menuTrack, 'y');
const hScroller=new Scroller(el.pan, el.panTrack, 'x');
sizeCanvas();
const glDraw=initGL();
draw = glDraw ? (()=>glDraw(glDraw._gl||(glDraw._gl=canvas.getContext('webgl')))) : initFallback();
art.seedCur=art.seedTarget=hashStr(state.items.join('|'));
let lastT=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  if(!REDUCED) art.time+=dt;
  art.seedCur  += (art.seedTarget-art.seedCur)*0.06;
  art.focusCur += (art.focusTarget-art.focusCur)*0.10;
  art.activeCur+= (art.activeTarget-art.activeCur)*0.08;
  art.c0=hueAt(art.seedCur); art.c1=hueAt(art.seedCur+0.33); art.c2=hueAt(art.seedCur+0.66);
  draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const ro=new ResizeObserver(()=>{ sizeCanvas(); vScroller.measure(); hScroller.measure(); });
ro.observe(document.body);
renderAll();
window.addEventListener('pywebviewready', async ()=>{
  const saved=await callApi('get_blocklist');
  if(Array.isArray(saved)&&saved.length){ state.items=saved; art.seedTarget=art.seedCur=hashStr(state.items.join('|')); renderAll(); }
});
</script>
</body>
